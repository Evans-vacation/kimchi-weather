name: Build & Release APK

# Every push to main builds a signed APK and publishes it as a GitHub Release.
# The app on the phone checks the latest Release and updates itself.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret이 없어요. README의 '2. 서명 키 등록'을 먼저 해 주세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Build release APK
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease assembleStoreRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -Prepo=${{ github.repository }}
          cp app/build/outputs/apk/github/release/app-github-release.apk nalssi.apk
          cp app/build/outputs/apk/store/release/app-store-release.apk nalssi-galaxystore.apk

      # 갤럭시 스토어용 APK (자동 업데이트 없음): Actions 실행 화면 맨 아래 Artifacts에서 받아요.
      # Release에는 올리지 않아요 — 폰 앱이 실수로 스토어용을 받지 않도록.
      - name: Upload Galaxy Store APK
        uses: actions/upload-artifact@v4
        with:
          name: galaxystore-apk
          path: nalssi-galaxystore.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 날씨 v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: nalssi.apk
          make_latest: true
