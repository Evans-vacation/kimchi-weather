name: Build & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret이 없어요. README의 '2. 서명 키 등록'을 먼저 해 주세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -Prepo=${{ github.repository }}
          cp app/build/outputs/apk/release/app-release.apk nalssi.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 날씨 v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: nalssi.apk
          make_latest: true
