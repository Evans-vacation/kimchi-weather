<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 날씨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, glanceable, like a good phone weather app
   IDEA: the window — the whole page takes on the sky outside
   PICTURE: large drawn sky icon + live sky-coloured backdrop
   COLOUR and TYPE: sky gradient by weather & time; IBM Plex Sans KR, light numerals
   LAYOUT: search bar, hero (place, temperature, icon), hourly strip, 7-day + details */
:root{color-scheme:dark;--g1:#1f6fc5;--g2:#5aa9e6;--ink:#fff;--soft:rgba(255,255,255,.78);--panel:rgba(10,20,40,.3);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip;
  background:linear-gradient(170deg,var(--g1),var(--g2)) fixed;transition:background .8s}
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.scene svg{width:100%;height:100%;display:block;filter:brightness(1.18) saturate(1.05)}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.22) 0,rgba(0,0,0,.06) 30%,rgba(0,0,0,.06) 50%,rgba(8,14,28,.32) 100%)}
/* readable on bright scenes: every text gets a soft shadow, big numbers a stronger one */
body{text-shadow:0 1px 2px rgba(0,0,0,.45),0 0 8px rgba(0,0,0,.18)}
.hero{text-shadow:0 2px 4px rgba(0,0,0,.4),0 0 18px rgba(0,0,0,.25)}
.badge,.toast,.mv button{text-shadow:none}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,16px) 40px}
button,input{font:inherit;color:inherit}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 auto;min-width:0}
.search input{width:100%;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--panel);padding:0 18px;font-size:16px;outline:none}
.search input::placeholder{color:var(--soft)}
.search input:focus,.btn:focus-visible,.chip:focus-visible,.res button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.res{position:absolute;z-index:5;top:52px;left:0;right:0;background:#16243a;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.35);display:none}
.res.on{display:block}
.res button{display:block;width:100%;text-align:left;padding:12px 18px;border:0;background:none;cursor:pointer}
.res button:hover{background:rgba(255,255,255,.08)}
.res small{color:var(--soft)}
.btn{height:46px;min-width:46px;padding:0 16px;border-radius:23px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.15)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.bar{flex-wrap:nowrap!important}
.btn.ico{width:46px;padding:0;display:grid;place-items:center;flex:none}
.btn.ico.on{background:#fff;color:#1f6fc5;text-shadow:none}
.btn.ico.busy svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.btn.ico.err{color:#ffb4b4;border-color:#ffb4b4}
.quick{padding:12px 14px 14px}.quick small{display:block;color:var(--soft);margin-bottom:8px}
.res .quick .chip{display:inline-flex;align-items:center;width:auto;padding:4px 14px;min-height:38px;background:rgba(255,255,255,.08)}
.res .quick .chip.on{background:rgba(255,255,255,.22)}
.chip{border:1px solid var(--line);background:rgba(10,20,40,.28);border-radius:16px;padding:4px 12px;min-height:34px;cursor:pointer;color:#fff;font-size:14px}
.chip:hover,.chip.on{background:rgba(10,20,40,.55);border-color:#fff;color:#fff}
.note{margin-top:12px;padding:10px 14px;border-radius:12px;background:rgba(255,200,60,.2);font-size:14px;display:none}
.note.on{display:block}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;padding:clamp(20px,4vw,44px) 0 clamp(16px,3vw,28px)}
.place{font-size:20px;font-weight:600}
.place small{display:block;font-size:14px;font-weight:400;color:var(--soft)}
.temp{font-size:clamp(76px,14vw,128px);font-weight:300;line-height:1;letter-spacing:-.03em;margin:6px 0}
.cond{font-size:22px}
.hl{color:var(--soft);font-variant-numeric:tabular-nums}
.big{width:clamp(130px,26vw,230px);aspect-ratio:1;filter:drop-shadow(0 10px 20px rgba(0,0,0,.25))}
.big svg{width:100%;height:100%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 18px;backdrop-filter:blur(6px)}
.panel h2{margin:0 0 10px;font-size:14px;font-weight:400;color:var(--soft)}
.hours{overflow-x:auto;scrollbar-width:thin}
.hstrip{position:relative}
.hcols{display:flex}
.hc{flex:none;width:62px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.hc .t{font-size:16px;font-weight:600}
.hc svg{width:34px;height:34px;display:block;margin:4px auto}
.hc .p{color:#9fd6ff;font-size:13px;min-height:20px}
.chart{display:block}
.day{display:grid;grid-template-columns:3.2em 34px 3em 3em minmax(40px,1fr) 3em;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.day:first-of-type{border-top:0}
.day svg{width:32px;height:32px}
.day .p{color:#9fd6ff;font-size:13px}
.day .lo{color:var(--soft);text-align:right}
.day .hi{text-align:right}
.rng{height:6px;border-radius:3px;background:rgba(255,255,255,.15);position:relative}
.rng i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7cc4ff,#ffc93c)}
.dets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.det{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px}
.det b{display:block;font-size:13px;font-weight:400;color:var(--soft)}
.det span{font-size:22px;font-weight:600;white-space:nowrap}
.det small{display:block;color:var(--soft);font-size:13px}
.arrow{display:inline-block;transition:transform .4s}
#cards{display:flex;flex-direction:column;gap:14px}
.card{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .2s,box-shadow .2s}
.card .hold{position:absolute;left:18px;right:18px;top:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden;opacity:0;transition:opacity .2s}
.card .hold i{display:block;height:100%;width:0;background:#fff}
.card.pressing .hold{opacity:1}.card.pressing .hold i{width:100%;transition:width 2s linear}
.card.lift{z-index:5;transform:scale(1.02);box-shadow:0 18px 40px rgba(0,0,0,.35);outline:2px solid #fff;transition:box-shadow .2s}
.card.dragging{transition:none}
.mv{position:absolute;top:10px;right:12px;display:none;gap:6px;z-index:6}
.card.lift .mv{display:flex}
.mv button{min-width:44px;height:40px;border-radius:20px;border:1px solid rgba(255,255,255,.5);background:rgba(10,20,40,.55);color:#fff;font:inherit;font-size:15px;cursor:pointer;padding:0 12px}
.mv button:focus-visible{outline:2px solid #fff}
.cmp{margin-top:4px;font-size:15px;font-weight:600}
.cmp .dn{color:#9fd6ff}.cmp .up{color:#ffc2a8}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet[hidden]{display:none}
.scard{width:min(520px,100%);background:#152238;border-radius:22px;padding:20px 18px 16px;text-shadow:none;max-height:90vh;overflow:auto}
.scard h3{margin:0 0 6px;font-size:20px}
.tg{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tg span{flex:1}.tg b{display:block;font-size:16px}.tg small{display:block;color:var(--soft);font-size:13px;margin-top:2px}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg i{flex:none;width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.2);position:relative;transition:background .2s}
.tg i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tg input:checked+i{background:#3d8bff}.tg input:checked+i::after{transform:translateX(20px)}
.tg input:focus-visible+i{outline:2px solid #fff;outline-offset:2px}
.tm{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:15px}
.tm input{font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:44px;color-scheme:dark}
.sbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.sbtn button,.sclose{font:inherit;font-size:15px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.sclose{width:100%;margin-top:10px;background:#3d8bff;border-color:#3d8bff}
.snote{font-size:13px;color:var(--soft);margin:10px 0 0;min-height:1em}
.nmock{position:fixed;left:50%;top:10px;width:min(440px,calc(100% - 20px));transform:translate(-50%,-140%);z-index:40;background:rgba(245,247,250,.97);color:#111;text-shadow:none;border-radius:20px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .35s ease;display:flex;gap:10px}
.nmock.on{transform:translate(-50%,0)}
.nmock .ni{flex:none;width:34px;height:34px;border-radius:10px;background:linear-gradient(#1f6fc5,#5aa9e6);display:grid;place-items:center}
.nmock .nb{flex:1;min-width:0}.nmock .nh{font-size:12px;color:#666}.nmock b{display:block;font-size:15px;margin-top:1px}
.nmock p{margin:2px 0 0;font-size:14px;line-height:1.4;white-space:pre-line}
.hint{margin:14px 0 0;font-size:13px;color:var(--soft);text-align:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:rgba(10,20,40,.85);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tip{margin:0 0 12px;font-size:16px}
.aqgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.aqc{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px}
.aqc b{display:block;font-size:13px;font-weight:400;color:var(--soft)}
.aqc .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.aqc .val{font-size:26px;font-weight:600;white-space:nowrap}.aqc .val small{font-size:13px;font-weight:400;color:var(--soft)}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:14px;font-weight:600;white-space:nowrap}
.g0{background:#3d7dff}.g1{background:#25b86a}.g2{background:#f29a1f}.g3{background:#e8484a}
.scale{position:relative;height:6px;border-radius:3px}
.scale i{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.aqh{margin-top:14px}
.aqrow{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:8px;align-items:end;margin-top:6px;font-size:13px;color:var(--soft)}
.bars{display:flex;align-items:flex-end;gap:2px;height:40px}
.bars i{flex:1;border-radius:2px 2px 0 0;min-height:3px}
.ticks{display:flex;margin-left:calc(4.2em + 8px);font-size:12px;color:var(--soft)}
.ticks span{flex:1;white-space:nowrap}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--soft)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:0;background:var(--c)}
.foot{margin-top:18px;font-size:13px;color:var(--soft)}
.foot a{color:#fff}
.loading .temp,.loading .cond{opacity:.4}
@media(max-width:420px){.aqgrid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr) auto}.big{width:120px}.cond{font-size:18px}
  .day{grid-template-columns:3em 30px 2.6em 2.6em minmax(30px,1fr) 2.6em;gap:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes bob{50%{transform:translateY(-6px)}}
.big svg{animation:bob 6s ease-in-out infinite}
</style>
</head>
<body>
<div class="scene" id="scene" aria-hidden="true"></div>
<div class="wrap" id="app">
  <div class="bar">
    <div class="search">
      <input id="q" type="search" placeholder="도시·동네 검색" autocomplete="off" aria-label="도시 검색">
      <div class="res" id="res" role="listbox"></div>
    </div>
    <button class="btn ico" id="loc" title="내 위치" aria-label="내 위치로 보기">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle class="dot" cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="btn ico" id="bell" title="알림 설정" aria-label="알림 설정">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>
    </button>
    <button class="btn ico" id="unit" title="단위 변경" aria-label="섭씨/화씨 바꾸기">°C</button>
  </div>
  <div class="note" id="note">실시간 날씨를 불러오지 못해 예시 데이터를 보여주고 있어요. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.</div>

  <section class="hero loading" id="hero">
    <div>
      <div class="place" id="place">불러오는 중…</div>
      <div class="temp" id="temp">--°</div>
      <div class="cond" id="cond">&nbsp;</div>
      <div class="hl" id="hl">&nbsp;</div>
      <div class="cmp" id="cmp"></div>
    </div>
    <div class="big" id="big"></div>
  </section>

  <div id="cards">
    <section class="panel card" data-id="air">
      <h2>미세먼지</h2>
      <div id="airtop"></div>
      <div class="aqh" id="airhrs"></div>
    </section>
    <section class="panel card" data-id="hours">
      <h2>시간별 예보</h2>
      <div class="hours"><div class="hstrip" id="hours"></div></div>
    </section>
    <section class="panel card" data-id="days"><h2>7일 예보</h2><div id="days"></div></section>
    <section class="panel card" data-id="dets"><h2>상세 정보</h2><div class="dets" id="dets"></div></section>
  </div>
  <p class="hint">항목을 2초 동안 꾹 누르고 있으면 위아래로 옮길 수 있어요.</p>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="nmock" id="nmock" aria-live="polite"></div>
  <div class="sheet" id="sheet" hidden>
    <div class="scard" role="dialog" aria-modal="true" aria-labelledby="stitle">
      <h3 id="stitle">알림</h3>
      <label class="tg"><span><b>비·눈 시작 알림</b><small>1~2시간 안에 비나 눈이 시작될 것 같으면 알려 드려요. 밤 11시~아침 6시에는 울리지 않아요.</small></span><input type="checkbox" id="nRain"><i></i></label>
      <label class="tg"><span><b>아침 날씨 브리핑</b><small>매일 정한 시간에 오늘 기온, 비 소식, 미세먼지, 옷차림을 한 번에 알려 드려요.</small></span><input type="checkbox" id="nBrief"><i></i></label>
      <label class="tm">브리핑 시간 <input type="time" id="nTime" value="07:00"></label>
      <div class="sbtn"><button id="tRain">비 알림 미리보기</button><button id="tBrief">브리핑 미리보기</button></div>
      <p class="snote" id="nNote"></p>
      <button class="sclose" id="sClose">닫기</button>
    </div>
  </div>
  <p class="foot" id="foot">날씨 데이터: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a></p>
</div>

<script>
/* Weather scenes: one original landscape (sky, mountains, lake, hill with pines) dressed per weather.
   sceneSVG(cat, night, animate) -> SVG string, 1600x1000, slice-fills its box.
   cat: clear | partly | cloudy | rain | snow | storm | fog. With animate, everything loops in 5 s. */
let sceneN = 0;
function sceneSVG(cat, night, animate){
  let seed = 7;
  const u = 'sc' + (++sceneN) + '_';
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const P = {
    clear:  [['#2a78dc','#7fc0f5','#a9d8ff'], ['#08122e','#1c2f62','#2c4682']],
    partly: [['#3a7cc8','#8cbbe4','#b7d6ef'], ['#0d1733','#22355f','#33496f']],
    cloudy: [['#5f7287','#98a8b8','#c0cad3'], ['#151c29','#2c3646','#3d4859']],
    rain:   [['#34445a','#5f7288','#8395a8'], ['#10161f','#212c3b','#2f3b4c']],
    snow:   [['#7189a6','#a9bcd0','#d4dfea'], ['#1a2335','#33435e','#4b5d7a']],
    storm:  [['#1b202b','#363f50','#556074'], ['#0c0f15','#1c222d','#2e3644']],
    fog:    [['#87929d','#aeb7bf','#cfd5da'], ['#1d2228','#3a4249','#525a62']]
  }[cat] || [['#3a7cc8','#8cbbe4','#b7d6ef'], ['#0d1733','#22355f','#33496f']];
  const snowy = cat === 'snow';
  const dim = night ? 0.55 : 1;
  const mix = (a, b, t) => { const p = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16)); const x = p(a), y = p(b);
    return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
  const [s1, s2, s3] = P[night ? 1 : 0].map(c => night ? mix(c, '#6d86c4', 0.24) : c);
  const far = mix(s2, night ? '#1a2850' : '#3d5a80', 0.4), near = mix(s2, night ? '#121d3a' : '#2b4766', 0.6);
  const lake1 = mix(s1, '#0b2a4a', night ? 0.5 : 0.25), lake2 = mix(s3, '#1d4f7a', 0.35);
  const hill1 = snowy ? (night ? '#6d7c96' : '#e9eff6') : (night ? '#1c2c48' : mix('#2d5a52', s1, 0.2));
  const hill2 = snowy ? (night ? '#56647c' : '#cfdbe7') : (night ? '#132038' : mix('#1f443f', s1, 0.15));
  const pine = snowy ? (night ? '#2e3a4c' : '#4b6a73') : (night ? '#0c1628' : '#173731');
  const cls = n => animate ? ` class="${n}"` : '';
  const out = [];

  out.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">`);
  out.push(`<defs>
    <linearGradient id="${u}sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s1}"/><stop offset=".55" stop-color="${s2}"/><stop offset="1" stop-color="${s3}"/></linearGradient>
    <linearGradient id="${u}lk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lake2}"/><stop offset="1" stop-color="${lake1}"/></linearGradient>
    <linearGradient id="${u}hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${hill1}"/><stop offset="1" stop-color="${hill2}"/></linearGradient>
    <radialGradient id="${u}gl"><stop offset="0" stop-color="${night ? '#fff6d8' : '#fff3c4'}" stop-opacity=".75"/><stop offset=".35" stop-color="${night ? '#fff6d8' : '#ffe9a0'}" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>`);
  if (animate) out.push(`<style>
    .drift{animation:dr 5s ease-in-out infinite alternate}.drift2{animation:dr2 5s ease-in-out infinite alternate}
    @keyframes dr{to{transform:translateX(46px)}}@keyframes dr2{to{transform:translateX(-34px)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pu 5s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.12);opacity:.8}}

/* ---------- weather codes ---------- */
function codeInfo(c){
  if (c === 0) return ['맑음','clear'];
  if (c === 1) return ['대체로 맑음','clear'];
  if (c === 2) return ['구름 조금','partly'];
  if (c === 3) return ['흐림','cloudy'];
  if (c === 45 || c === 48) return ['안개','fog'];
  if (c >= 51 && c <= 57) return ['이슬비','rain'];
  if (c >= 61 && c <= 67) return [c >= 66 ? '어는 비' : (c === 65 ? '강한 비' : '비'),'rain'];
  if (c >= 71 && c <= 77) return [c === 77 ? '싸락눈' : (c === 75 ? '많은 눈' : '눈'),'snow'];
  if (c >= 80 && c <= 82) return ['소나기','rain'];
  if (c === 85 || c === 86) return ['눈 소나기','snow'];
  if (c >= 95) return [c === 95 ? '뇌우' : '우박 동반 뇌우','storm'];
  return ['알 수 없음','cloudy'];
}

/* ---------- data ---------- */
async function getJSON(url, ms = 9000){
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), ms);
  try{ const r = await fetch(url, {signal: ctl.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(tm); }
}
function fcUrl(p){
  return `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}` +
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl,cloud_cover' +
    '&hourly=temperature_2m,precipitation_probability,weather_code,is_day' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max' +
    '&wind_speed_unit=ms&timezone=auto&forecast_days=7&past_hours=24';
}
const aqUrl = p => `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.lat}&longitude=${p.lon}&current=pm10,pm2_5&hourly=pm10,pm2_5&forecast_days=2&timezone=auto`;

function demoData(){
  const pad = n => String(n).padStart(2,'0');
  const now = new Date(), base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const codes = [1,2,3,61,3,0,2];
  const h = {time:[],temperature_2m:[],precipitation_probability:[],weather_code:[],is_day:[]};
  for (let i = 0; i < 168; i++){
    const d = new Date(base.getTime() + i * 3600e3), hr = d.getHours(), di = Math.floor(i / 24);
    h.time.push(`${iso(d)}T${pad(hr)}:00`);
    h.temperature_2m.push(5 + di % 3 - 4 * Math.cos((hr - 3) / 24 * 2 * Math.PI));
    h.weather_code.push(codes[di]); h.is_day.push(hr >= 7 && hr < 17 ? 1 : 0);
    h.precipitation_probability.push(codes[di] === 61 ? 60 + (hr % 5) * 5 : (hr * 7 + di * 3) % 20);
  }
  const dl = {time:[],weather_code:codes,temperature_2m_max:[],temperature_2m_min:[],precipitation_probability_max:[],sunrise:[],sunset:[],uv_index_max:[]};
  for (let i = 0; i < 7; i++){
    const d = new Date(base.getTime() + i * 864e5), s = iso(d), sl = h.temperature_2m.slice(i*24, i*24+24);
    dl.time.push(s); dl.temperature_2m_max.push(Math.max(...sl)); dl.temperature_2m_min.push(Math.min(...sl));
    dl.precipitation_probability_max.push(Math.max(...h.precipitation_probability.slice(i*24, i*24+24)));
    dl.sunrise.push(s + 'T07:21'); dl.sunset.push(s + 'T17:15'); dl.uv_index_max.push(2.5);
  }
  // yesterday, 2° warmer, so "어제와 비교" shows in the demo too
  const y = new Date(base.getTime() - 864e5), todayT = h.temperature_2m.slice(0, 24);
  for (let hr = 23; hr >= 0; hr--){
    h.time.unshift(`${iso(y)}T${pad(hr)}:00`); h.temperature_2m.unshift(todayT[hr] + 2);
    h.weather_code.unshift(2); h.is_day.unshift(hr >= 7 && hr < 17 ? 1 : 0); h.precipitation_probability.unshift(0);
  }
  const idx = 24 + now.getHours();
  return { current:{ time:h.time[idx], temperature_2m:h.temperature_2m[idx], relative_humidity_2m:58, apparent_temperature:h.temperature_2m[idx]-2.5,
    is_day:h.is_day[idx], precipitation:0, weather_code:codes[0], wind_speed_10m:3.2, wind_direction_10m:315, pressure_msl:1021 }, hourly:h, daily:dl };
}

function renderHours(d){

const GR = ['좋음','보통','나쁨','매우 나쁨'], GC = ['#3d7dff','#25b86a','#f29a1f','#e8484a'];
const CUTS = {pm10:[30,80,150], pm25:[15,35,75]};
function gradeIdx(v, kind){ if (v == null) return -1; const c = CUTS[kind]; let i = 0; while (i < 3 && v > c[i]) i++; return i; }
function demoAir(curTime){
  const h = {time:[], pm10:[], pm2_5:[]}, base = curTime.slice(0,11), start = Number(curTime.slice(11,13));
  for (let k = 0; k < 30; k++){
    const hr = (start + k) % 24;
    h.time.push(`${base}${String(hr).padStart(2,"0")}:00`);
    h.pm10.push(Math.round(38 + 22 * Math.sin((k + 3) / 5))); h.pm2_5.push(Math.round(18 + 12 * Math.sin((k + 2) / 5)));
  }
  return { current:{time:curTime, pm10:38, pm2_5:18}, hourly:h };

function renderAir(){
  const aq = state.aq;
  if (!aq || !aq.current || (aq.current.pm10 == null && aq.current.pm2_5 == null)){
    $('#airtop').innerHTML = '<p class="tip">이 지역의 미세먼지 정보를 불러오지 못했어요.</p>'; $('#airhrs').innerHTML = ''; return;
  }
  const c = aq.current, g10 = gradeIdx(c.pm10, 'pm10'), g25 = gradeIdx(c.pm2_5, 'pm25'), worst = Math.max(g10, g25);
  const tips = ['공기가 깨끗해요. 바깥 활동하기 좋아요.', '보통 수준이에요. 민감한 분은 오래 밖에 있을 때 마스크를 챙기세요.',

  const card = (label, v, gi, kind, max) => {
    const [a, b, cc] = CUTS[kind].map(x => (x / max * 100).toFixed(0));
    const grad = `linear-gradient(90deg,${GC[0]} 0 ${a}%,${GC[1]} ${a}% ${b}%,${GC[2]} ${b}% ${cc}%,${GC[3]} ${cc}% 100%)`;

      <div class="scale" style="background:${grad}">${v == null ? '' : `<i style="left:${Math.min(v / max * 100, 100).toFixed(1)}%"></i>`}</div></div>`;

  if (!h || !h.time){ $('#airhrs').innerHTML = ''; return; }

const WORLD_QUICK = ['도쿄','오사카','후쿠오카','방콕','다낭','파리','런던','뉴욕'];
function localSearch(q){
  const qs = q.replace(/\s+/g, ' ').trim(); if (!qs) return [];
  const toks = qs.split(' ');
  const last = toks[toks.length - 1], ctx = toks.slice(0, -1);
  const sggName = i => DONG.sgg[i][1], sidoName = i => DONG.sido[DONG.sgg[i][0]];
  const fits = gi => ctx.every(t => sggName(gi).includes(t) || sidoName(gi).includes(t));
  const out = [];
  // big Korean cities (광역시·특별시 etc.) by their short name: "광주" → 광주광역시
  if (!ctx.length) for (const p of PRESETS) if (p.name === last || p.name.startsWith(last) || p.admin.startsWith(last)) out.push({score:-1, ...p});
  // 동 / 읍 / 면
  for (const [nm, gi, lat, lon] of DONG.dong){
    if (!fits(gi)) continue;
    const base = nm.replace(/(동|읍|면)$/, '');
    const score = nm === last ? 0 : base === last ? 0 : nm.startsWith(last) ? 1 : nm.includes(last) ? 3 : -1;
    if (score >= 0) out.push({score, name:nm, admin:sggName(gi), country:sidoName(gi), lat, lon});
  }
  // 시 / 군 / 구 (centre of its 동)
  DONG.sgg.forEach(([si, nm], gi) => {
    const parts = nm.split(' '), hit = parts.some(p => p === last || p.replace(/(시|군|구)$/, '') === last || p.startsWith(last));
    if (!hit || !ctx.every(t => nm.includes(t) || DONG.sido[si].includes(t))) return;
    const ds = DONG.dong.filter(d => d[1] === gi);
    const lat = ds.reduce((a, d) => a + d[2], 0) / ds.length, lon = ds.reduce((a, d) => a + d[3], 0) / ds.length;
    out.push({score: 0.5, name:nm, admin:'', country:DONG.sido[si], lat:+lat.toFixed(4), lon:+lon.toFixed(4)});
  });
  // cities abroad: "파리", "LA", "하와이", or a country ("일본")
  const ql = qs.toLowerCase();
  for (const [nm, cn, lat, lon, alt] of WORLD){
    const inner = (nm.match(/\((.*)\)/) || [])[1];
    const names = [nm, nm.replace(/\(.*\)/, ''), inner, ...(alt || [])].filter(Boolean).map(n => n.toLowerCase());
    const sc = names.includes(ql) ? 0 : names.some(n => n.startsWith(ql)) ? 1 : cn === qs ? 2 : (ql.length > 1 && names.some(n => n.includes(ql))) ? 3 : -1;
    if (sc >= 0) out.push({score: sc + 0.2, name:nm, admin:'', country:cn, lat, lon});
  }
  out.sort((a, b) => a.score - b.score);
  return out.slice(0, 8).map(({score, ...r}) => ({...r, local:true}));
}

/* Three sources at once: the phone's geocoder (Android app), OpenStreetMap, Open-Meteo. */
let searchSeq = 0;
function nativeSearch(q){
  return new Promise(resolve => {
    if (!(window.Android && window.Android.searchPlace)) return resolve([]);
    const id = 's' + Date.now() + Math.random().toString(36).slice(2, 6);
    geoWaiting[id] = v => resolve(Array.isArray(v) ? v : []);
    setTimeout(() => { if (geoWaiting[id]){ delete geoWaiting[id]; resolve([]); } }, 6000);
    try{ window.Android.searchPlace(q, id); }catch(e){ delete geoWaiting[id]; resolve([]); }
  });
}
async function osmSearch(q, krOnly){
  try{
    const j = await getJSON(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=jsonv2&addressdetails=1&limit=6&accept-language=ko${krOnly ? '&countrycodes=kr' : ''}`, 6000);
    return j.map(r => {
      const a = r.address || {}, name = r.name || String(r.display_name || '').split(',')[0];
      const gu = [a.borough, a.city_district, a.county].find(v => v && v !== name) || '';
      const si = [a.city, a.province, a.state].find(v => v && v !== name && v !== gu) || '';
      const admin = [gu, si].filter(Boolean).join(' ');
      return {name, admin, country: a.country || '', lat: +r.lat, lon: +r.lon};
    }).filter(r => r.name && isFinite(r.lat));
  }catch(e){ return []; }
}
async function omSearch(q){
  try{
    const j = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=ko&format=json`, 6000);
    return (j.results || []).map(r => ({name:r.name, admin:r.admin1 || '', country:r.country || '', lat:r.latitude, lon:r.longitude}));
  }catch(e){ return []; }
}
async function search(q){
  q = q.trim(); if (!q){ showQuick(); return; }
  const seq = ++searchSeq;
  const local = localSearch(q);
  const pre = local.length ? local : PRESETS.filter(p => p.name.includes(q) || q.includes(p.name));
  if (pre.length) showResults(pre);
  else { $('#res').innerHTML = '<button disabled><small>검색 중…</small></button>'; $('#res').classList.add('on'); }
  // Short Korean names ("신림", "역삼") are usually a 동: search "신림동" in Korea too.
  const asDong = /^[가-힣]{1,5}$/.test(q) && !/(동|시|구|군|읍|면|리|도|가)$/.test(q) ? q + '동' : null;
  const jobs = [nativeSearch(q), osmSearch(q), omSearch(q)];
  if (asDong) jobs.unshift(nativeSearch(asDong), osmSearch(asDong, true));
  const found = await Promise.all(jobs);
  if (seq !== searchSeq) return;                       // a newer search is running
  const seen = new Set(), list = [];
  const near = (a, b) => Math.abs(a.lat - b.lat) < 0.04 && Math.abs(a.lon - b.lon) < 0.05;   // ~4 km
  for (const r of pre.concat(...found)){
    const key = r.name + '@' + r.lat.toFixed(2) + ',' + r.lon.toFixed(2);
    if (seen.has(key) || list.some(x => x.name === r.name && near(x, r))) continue;
    seen.add(key); list.push(r);
  }
  const isKr = r => /대한민국|한국|South Korea|Korea, Republic/.test(r.country || '') || DONG.sido.includes(r.country);
  const exactDong = r => asDong && String(r.name).startsWith(asDong);
  list.sort((a, b) => (!!b.local - !!a.local) || (exactDong(b) - exactDong(a)) || (isKr(b) - isKr(a)));   // stable: keeps source order otherwise
  showResults(list.slice(0, 8));
}
$('#q').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value), 300); });
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); clearTimeout(timer);
    if (results[0] && $('#res').classList.contains('on')) pick(results[0]); else search(e.target.value); }
  if (e.key === 'Escape') $('#res').classList.remove('on');
});
function pick(r){ $('#res').classList.remove('on'); $('#q').value = ''; $('#q').blur(); loadPlace(r); }
$('#res').addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) pick(results[+b.dataset.r]); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#res').classList.remove('on'); });
$('#res').addEventListener('click', e => {
  const b = e.target.closest('[data-i]'); if (b) return pick(PRESETS[+b.dataset.i]);
  const w = e.target.closest('[data-w]'); if (!w) return;
  const c = WORLD.find(x => x[0] === w.dataset.w); if (c) pick({name:c[0], admin:'', country:c[1], lat:c[2], lon:c[3]});
});
$('#q').addEventListener('focus', e => { if (!e.target.value.trim()) showQuick(); });

$('#unit').addEventListener('click', () => { state.unit = state.unit === 'C' ? 'F' : 'C'; store.set('unit', state.unit); render(); });
/* GPS → 동 이름: phone's geocoder first (Android app), then OpenStreetMap */
const geoWaiting = {};
window.__geoDone = (id, json) => { const f = geoWaiting[id]; delete geoWaiting[id]; if (f) f(json ? JSON.parse(json) : null); };
function nativeName(lat, lon){
  return new Promise(resolve => {
    if (!(window.Android && window.Android.reverseGeocode)) return resolve(null);
    const id = 'g' + Date.now();
    geoWaiting[id] = resolve;
    setTimeout(() => { if (geoWaiting[id]){ delete geoWaiting[id]; resolve(null); } }, 8000);
    try{ window.Android.reverseGeocode(lat, lon, id); }catch(e){ delete geoWaiting[id]; resolve(null); }
  });
}
async function osmName(lat, lon){
  try{
    const j = await getJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=16&accept-language=ko`);
    const a = j.address || {};
    const dong = [a.quarter, a.suburb, a.neighbourhood, a.village, a.town].find(v => v && /(동|읍|면|가)$/.test(v)) || '';
    return { dong, gu: a.city_district || a.borough || a.county || '', city: a.city || a.province || a.state || '' };
  }catch(e){ return null; }
}
async function placeName(lat, lon){
  let n = await nativeName(lat, lon);
  if (!n || !n.dong){ const m = await osmName(lat, lon); if (m && (m.dong || !n)) n = m; }
  return n;
}
$('#loc').addEventListener('click', () => {
  const L = $('#loc'), setLoc = st => { L.classList.remove('busy', 'err'); if (st) L.classList.add(st); };
  if (!navigator.geolocation){ setLoc('err'); toast('이 기기에서는 위치를 쓸 수 없어요'); return; }
  setLoc('busy');
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      const n = await placeName(lat, lon);
      setLoc('');
      const name = (n && (n.dong || n.gu)) || '현재 위치';
      const admin = n ? (n.dong ? n.gu : '') : '';
      const country = n && n.city ? n.city : `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
      loadPlace({name, admin, country, lat, lon, gps:true});
    },
    () => { setLoc('err'); toast('위치 권한을 허용해 주세요'); setTimeout(() => setLoc(''), 2500); },
    {timeout: 10000}
  );
});

/* ---------- 어제와 비교 ---------- */
function yesterdayDiff(d){
  const h = d.hourly; if (!h || !h.time) return null;
  const i = h.time.findIndex(t => t.slice(0,13) === String(d.current.time).slice(0,13));
  if (i < 24) return null;
  const y = h.temperature_2m[i - 24]; if (y == null) return null;
  return d.current.temperature_2m - y;
}
function compareText(d){
  const diff = yesterdayDiff(d); if (diff == null) return '';
  const n = Math.round(state.unit === 'C' ? Math.abs(diff) : Math.abs(diff) * 9 / 5);
  if (n < 1) return '어제와 비슷해요';
  return diff < 0 ? `어제보다 <span class="dn">${n}° 낮아요</span>` : `어제보다 <span class="up">${n}° 높아요</span>`;
}

/* ---------- 알림 (same wording as the phone notifications in Notify.kt) ---------- */
const isWet = c => (c >= 51 && c <= 67) || (c >= 71 && c <= 77) || (c >= 80 && c <= 86) || c >= 95;
const isSnow = c => (c >= 71 && c <= 77) || c === 85 || c === 86;
function hourLabel(t){ const h = Number(String(t).slice(11,13)); return (h < 12 ? '오전 ' : '오후 ') + (h % 12 === 0 ? 12 : h % 12) + '시'; }
function upcoming(d, maxH){
  const h = d.hourly; let s = h.time.findIndex(t => t.slice(0,13) === String(d.current.time).slice(0,13)); if (s < 0) s = 0;
  for (let k = 1; k <= maxH && s + k < h.time.length; k++){
    const i = s + k;
    if (isWet(h.weather_code[i]) && (h.precipitation_probability[i] ?? 0) >= 50) return {k, time:h.time[i], code:h.weather_code[i], pop:h.precipitation_probability[i]};
  }
  return null;
}
function adviceText(d){
  const c = d.current, dl = d.daily, u = upcoming(d, 12) , step = dustStepJS();
  const coming = c.weather_code >= 95 || (u && u.code >= 95) ? ['천둥번개 조심,','천둥번개 조심하세요']
    : (u && (u.code === 75 || u.code === 86)) ? ['겨울타이어 챙기고','겨울타이어 챙기세요']
    : (u && isSnow(u.code)) ? ['빙판길 조심,','빙판길 조심하세요']
    : (u || isWet(c.weather_code)) ? ['우산 챙기고','우산 꼭 챙기세요']
    : step != null && step >= 6 ? ['마스크 쓰고','마스크 꼭 쓰세요'] : null;
  const f = c.apparent_temperature, mx = dl.temperature_2m_max[0], mn = dl.temperature_2m_min[0];
  const wear = f <= -10 ? '패딩·장갑 꼭 챙겨요' : f <= -3 ? '패딩 입어요' : f <= 5 ? '두꺼운 외투 입어요' : mx >= 33 ? '물 자주 마셔요'
    : mx >= 28 ? '시원하게 입어요' : mx - mn >= 10 ? '겉옷 챙겨요' : f <= 12 ? '가벼운 겉옷 챙겨요' : null;
  return coming && wear ? coming[0] + ' ' + wear : coming ? coming[1] : wear || '외출하기 좋은 날이에요';
}
function dustStepJS(){
  const c = state.aq && state.aq.current; if (!c) return null;
  const st = (v, cuts) => v == null ? -1 : cuts.filter(x => v > x).length;
  const a = st(c.pm10, [10,20,30,45,60,80,115,150]), b = st(c.pm2_5, [5,10,15,22,29,35,55,75]);
  return Math.max(a, b) < 0 ? null : Math.max(a, b);
}
function rainNotice(d){
  const u = upcoming(d, 2); if (!u) return null;
  const what = isSnow(u.code) ? '눈' : '비';
  return {title: what === '눈' ? '곧 눈이 와요 ❄️' : '곧 비가 와요 ☔',
          body: `${state.place.name}에 ${hourLabel(u.time)}쯤부터 ${what} 소식이 있어요 (확률 ${u.pop}%). ${what === '눈' ? '미끄럼 조심하세요.' : '우산 챙기세요.'}`};
}
function briefNotice(d){
  const c = d.current, dl = d.daily, [label] = codeInfo(c.weather_code), u = upcoming(d, 23 - Number(String(c.time).slice(11,13)));
  const diff = yesterdayDiff(d), cmp = diff == null ? '' : Math.abs(diff) < 1 ? ' · 어제와 비슷' : ` · 어제보다 ${Math.round(Math.abs(diff))}° ${diff < 0 ? '낮음' : '높음'}`;
  const step = dustStepJS(), dw = step == null ? '' : ['아주 좋음','좋음','좋음','보통','보통','보통','나쁨','나쁨','위험'][step];
  const lines = [
    `${label} ${Math.round(c.temperature_2m)}° · 최저 ${Math.round(dl.temperature_2m_min[0])}° / 최고 ${Math.round(dl.temperature_2m_max[0])}°${cmp}`,
    u ? `${hourLabel(u.time)}쯤 ${isSnow(u.code) ? '눈' : '비'} 소식 (확률 ${u.pop}%)` : '오늘은 비 소식이 없어요',
    dw ? `미세먼지 ${dw}` : '',
    adviceText(d)
  ].filter(Boolean);
  return {title: `오늘의 날씨 · ${state.place.name}`, body: lines.join('\n')};
}
function mockNotify(n){
  const m = $('#nmock');
  m.innerHTML = `<div class="ni">${icon('partly', true).replace('<svg', '<svg width="26" height="26"')}</div><div class="nb"><div class="nh">날씨 · 지금</div><b>${esc(n.title)}</b><p>${esc(n.body)}</p></div>`;
  m.classList.add('on'); clearTimeout(mockNotify.t); mockNotify.t = setTimeout(() => m.classList.remove('on'), 6000);
}
const hasNative = () => !!(window.Android && window.Android.getNotify);
function loadNotify(){
  let v = null;
  try{ v = hasNative() ? JSON.parse(window.Android.getNotify()) : store.get('notify', null); }catch(e){}
  v = Object.assign({rain:false, brief:false, time:'07:00'}, v || {});
  $('#nRain').checked = v.rain; $('#nBrief').checked = v.brief; $('#nTime').value = v.time;
  $('#nNote').textContent = hasNative() ? (v.permission === false ? '알림 권한이 꺼져 있어요. 켜면 알림이 와요.' : '') : '미리보기 화면에서는 알림 모양만 보여 드려요. 폰 앱에서는 실제로 알림이 와요.';
}
function saveNotify(){
  const v = {rain:$('#nRain').checked, brief:$('#nBrief').checked, time:$('#nTime').value || '07:00'};
  if (hasNative()){ try{ window.Android.setNotify(JSON.stringify(v)); }catch(e){} } else store.set('notify', v);
  toast(v.rain || v.brief ? '알림을 설정했어요' : '알림을 껐어요');
}
$('#bell').addEventListener('click', () => { loadNotify(); $('#sheet').hidden = false; $('#sClose').focus(); });
$('#sClose').addEventListener('click', () => { $('#sheet').hidden = true; $('#bell').focus(); });
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('#sheet').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) $('#sheet').hidden = true; });
['nRain','nBrief','nTime'].forEach(id => $('#' + id).addEventListener('change', saveNotify));
$('#tRain').addEventListener('click', () => {
  const d = state.data; if (!d) return;
  const n = rainNotice(d) || {title:'곧 비가 와요 ☔', body:`${state.place.name}에 ${hourLabel('0000-00-00T' + String((new Date().getHours() + 1) % 24).padStart(2,'0'))}쯤부터 비 소식이 있어요 (확률 70%). 우산 챙기세요.\n※ 미리보기: 지금은 2시간 안에 비 소식이 없어서 예시로 보여 드려요.`};
  if (hasNative()) { try{ window.Android.testNotify('rain', JSON.stringify(n)); }catch(e){} } else mockNotify(n);
});
$('#tBrief').addEventListener('click', () => {
  const d = state.data; if (!d) return;
  const n = briefNotice(d);
  if (hasNative()) { try{ window.Android.testNotify('brief', JSON.stringify(n)); }catch(e){} } else mockNotify(n);
});

/* ---------- reorder cards: hold 2 s, then drag or use ▲▼ ---------- */
const HOLD_MS = 2000;
const cardsBox = $('#cards');
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1800); }
function saveOrder(){ store.set('order', [...cardsBox.children].map(c => c.dataset.id)); }
(function restoreOrder(){
  const order = store.get('order', null);
  if (Array.isArray(order)) order.forEach(id => { const c = cardsBox.querySelector(`[data-id="${id}"]`); if (c) cardsBox.appendChild(c); });
})();
cardsBox.querySelectorAll('.card').forEach(c => {
  c.insertAdjacentHTML('afterbegin', '<div class="hold"><i></i></div><div class="mv"><button data-mv="-1" aria-label="위로">▲</button><button data-mv="1" aria-label="아래로">▼</button><button data-mv="0">완료</button></div>');
});
let press = null, drag = null, lifted = null;
function haptic(){ try{ if (window.Android && window.Android.haptic) window.Android.haptic(); else if (navigator.vibrate) navigator.vibrate(30); }catch(e){} }
function lift(card){ if (lifted && lifted !== card) drop(); lifted = card; card.classList.add('lift'); haptic(); }
function drop(){ if (!lifted) return; lifted.classList.remove('lift', 'dragging'); lifted.style.transform = ''; lifted = null; saveOrder(); toast('순서를 저장했어요'); }
function cancelPress(){ if (!press) return; clearTimeout(press.timer); press.card.classList.remove('pressing'); press = null; }
function move(card, dir){
  if (dir < 0 && card.previousElementSibling) cardsBox.insertBefore(card, card.previousElementSibling);
  if (dir > 0 && card.nextElementSibling) cardsBox.insertBefore(card.nextElementSibling, card);
  card.scrollIntoView({block:'nearest', behavior:'smooth'});
}
cardsBox.addEventListener('contextmenu', e => e.preventDefault());
cardsBox.addEventListener('click', e => {
  const b = e.target.closest('[data-mv]'); if (!b) return;
  const card = b.closest('.card'), d = +b.dataset.mv;
  if (d === 0) drop(); else move(card, d);
});
cardsBox.addEventListener('pointerdown', e => {
  if (e.target.closest('.mv, a, button, input')) return;
  const card = e.target.closest('.card'); if (!card) return;
  if (lifted === card){ drag = {card, y: e.clientY, moved:false}; card.classList.add('dragging'); return; }
  if (lifted) drop();
  cancelPress();
  card.classList.add('pressing');
  press = {card, x: e.clientX, y: e.clientY, timer: setTimeout(() => {
    card.classList.remove('pressing'); press = null;
    lift(card); drag = {card, y: lastY, moved:false}; card.classList.add('dragging');
  }, HOLD_MS)};
  lastY = e.clientY;
});
let lastY = 0;
window.addEventListener('pointermove', e => {
  lastY = e.clientY;
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) cancelPress();
  if (!drag) return;
  const card = drag.card;
  let dy = e.clientY - drag.y;
  if (Math.abs(dy) > 6) drag.moved = true;
  const prev = card.previousElementSibling, next = card.nextElementSibling;
  if (prev && dy < -prev.offsetHeight / 2){ const t = card.offsetTop; cardsBox.insertBefore(card, prev); drag.y += card.offsetTop - t; dy = e.clientY - drag.y; haptic(); }
  else if (next && dy > next.offsetHeight / 2){ const t = card.offsetTop; cardsBox.insertBefore(next, card); drag.y += card.offsetTop - t; dy = e.clientY - drag.y; haptic(); }
  card.style.transform = `translateY(${dy}px) scale(1.02)`;
});
function endPointer(){
  cancelPress();
  if (!drag) return;
  const {card, moved} = drag; drag = null;
  card.classList.remove('dragging'); card.style.transform = '';
  if (moved) drop();   // dragged: done. Not moved: stay selected for ▲▼ / 완료
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
// keep the page from scrolling while a card is being dragged
document.addEventListener('touchmove', e => { if (drag || press) { if (drag) e.preventDefault(); } }, {passive:false});
document.addEventListener('pointerdown', e => { if (lifted && !e.target.closest('.card')) drop(); });

markChips();
loadPlace(state.place);
setInterval(() => { if (!document.hidden) loadPlace(state.place); }, 15 * 60 * 1000);
}
